# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Chốt bởi Lương Thị Hồng Hạnh (hatrang200715) trên kết quả D1 của Quang (src/lab13.py).
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml', encoding='utf-8'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 1 + 74×0,02 = 2,48 -> 3.103/nhóm -> cần 42 người/nhóm (84 > 40): không đủ người
#   c) 20 nhân viên mỗi nhóm: trần hiệu dụng c/ICC = 20/0,02 = 1.000 < 1.251: không đạt mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: trần c/ICC = 300 < 1.251, và chỉ 6 cụm mỗi nhóm: loại
#   e) Mức chênh 6 điểm (859 hiệu dụng/nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu/người (DE = 6,96),
#      thu 5.980 yêu cầu/nhóm -> 859 hiệu dụng; power chỉ còn 0,64 nếu chênh thật là 5 điểm.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (chia theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: CÓ - 20 nhân viên đối chứng làm cùng tuần, cùng depot với nhóm được trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên bằng code, seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: rủi ro nhân viên đối chứng nghe cách dùng từ nhóm can thiệp trong depot;
#      giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id, soát hằng tuần.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: CÓ - chốt trước ngày bắt đầu (xem primary_metric, stop_rules, decision_date).
#   5. Ít nhất 20 cụm mỗi nhóm: CÓ - đúng 20 nhân viên mỗi nhóm (tổng 40 nhân viên CSKH).
#
# Đánh đổi đã chấp nhận (cách chia nhân viên chưa đạt mức chênh 5 điểm với 20 cụm/nhóm):
#   không đủ mẫu cho +5 điểm, nên chấp nhận mức chênh mục tiêu +6 điểm (bất lợi: power 0,64 nếu tác động thật 5 điểm,
#   phải được Giám đốc vận hành ký chấp nhận); bù lại tách được tác động vì 20 cụm/nhóm và đối chứng cùng thời gian.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại: 4,25% toàn mẫu (51/1.200); 3,97% trong phạm vi pilot (39/982).
#   Ngưỡng an toàn chọn so với nhóm đối chứng: chênh >= +2 điểm HOẶC trần tuyệt đối 6%
#   (đặt ngưỡng tuyệt đối 3% sẽ làm pilot dừng ngay tuần đầu dù đang ở 3,97%).

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated); loại quoc_te (1,88×, chạy lại không giúp: ok lần 2 chỉ 11,4%) và doi_tac (0,85×, sát ngưỡng)"
  assignment:
    unit: "staff"                 # chia theo nhân viên: 20 + 20, bốc thăm bằng code, phân tầng theo depot
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 -> 10 -> 20 nhân viên; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 20 cụm/nhóm không đủ mẫu cho 0.05
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # yêu cầu hiệu dụng mỗi nhánh ở MDE 0,06
    observed_requests_per_arm: 5980  # số yêu cầu thực tại 20 nhân viên × 299
    min_requests_per_staff: 299
    followup_days_after_close: 7
    design_effect: 6.96           # 1 + (299 - 1) × 0.02
    clusters_per_arm: 20          # 20 nhân viên mỗi nhóm, ~299 yêu cầu/người (thu 5.980 yêu cầu/nhóm)
  identifiability:
    concurrent_control: "Có - nhóm đối chứng 20 nhân viên làm cùng thời gian, cùng depot"
    spillover_risk: "Nhân viên đối chứng học cách dùng từ nhóm can thiệp; giảm bằng quyền truy cập theo tài khoản + log lượt mở trợ lý theo staff_id"
    predeclared: "Chỉ số chính, ngưỡng dừng, luật dừng và ngày quyết định chốt trước ngày bắt đầu pilot"
  stop_rules:
    - "NẾU có ít nhất 1 ca hoàn trùng đã xác nhận trong pilot hoặc tỷ lệ mở lại 7 ngày của nhánh can thiệp cao hơn đối chứng ít nhất 2 điểm phần trăm hay vượt 6% TRONG 3 ngày liên tiếp trên các yêu cầu đã đủ theo dõi THÌ Giám đốc vận hành tắt trợ lý trong 30 phút từ khi xác nhận vi phạm KHÔNG THÌ không được tăng tỷ lệ can thiệp khi cảnh báo còn mở"
    - "NẾU chi phí đo trong pilot vượt 8.000 đ trên mỗi việc agent hoàn thành TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở rộng hang_nang trước khi kiểm tra lại chi phí"
    - "NẾU tỉ lệ bỏ qua gợi ý (sửa + bỏ trên ca được xem lại) > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  cost_measurement: "Tính chi phí token và tool của toàn bộ lượt chạy cộng tiền nhân công từ phút xem lại và làm lại đo thực. Chia cho số yêu cầu agent hoàn thành đã đủ theo dõi trong cùng kỳ của nhánh can thiệp."
  interim_looks: "Theo dõi an toàn, chi phí và mức sử dụng theo luật dừng. Kiểm định chỉ số chính sau khi đạt điều kiện chốt."
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm (12.000 đ/yêu cầu)"
  decision_date: "2027-01-05"    # mốc dự kiến
  decision_condition: "Chỉ phân tích các yêu cầu đủ điều kiện từ bước 0.50 ở hai nhánh. Chốt khi mỗi nhánh đủ 20 nhân viên, ít nhất 299 yêu cầu/người và từ 5.980 yêu cầu thực, với cửa sổ đóng trong 24 giờ và đủ 7 ngày theo dõi sau đóng. Nếu chưa đạt ở ngày dự kiến, lùi ngày chốt và duy trì đối chứng nếu các luật dừng cho phép."
  simulated_inputs:               # mọi con số tính từ cột _simulated (phut_xem_lai_simulated, phut_lam_lai_simulated)
    - "Chi phí mỗi việc thành công 4.472 đ (toàn mẫu) và 4.599 đ gồm cố định, trong phạm vi pilot [simulated]"
    - "Chi phí sẽ xem lại 100% trong phạm vi: 11.743 đ = 0,98× (12.415 đ = 1,03× nếu làm lại 15,3 phút/ca) [simulated]"
    - "Độ nhạy: làm lại +51,8%, xem lại +40,7%, lương +23,1% trên chi phí mỗi việc thành công [simulated]"
    - "Ngưỡng dự kiến 8.000 đ/việc tham chiếu mô hình chi phí [simulated]; khi áp dụng dùng số đo từ pilot"
